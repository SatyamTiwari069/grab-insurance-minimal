<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrabInsurance Project 2 - Embedded Insurance at Deal Redemption</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #000000;
            color: #ffffff;
        }

        body {
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
        }

        header {
            background: linear-gradient(90deg, #000000, #1a1a1a);
            padding: 20px;
            margin: -20px -20px 20px -20px;
            border-bottom: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 28px;
            color: #00ff41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            margin-bottom: 5px;
        }

        header p {
            font-size: 12px;
            color: #888;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            animation: slideUp 0.6s ease-out;
        }

        .tab-btn {
            padding: 12px 24px;
            border: 2px solid transparent;
            background: #111;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            border-color: #00ff41;
            color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00ff41, #00cc33);
            color: #000000;
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            animation: fadeIn 0.5s ease-in;
        }

        .tab-content::-webkit-scrollbar {
            width: 8px;
        }

        .tab-content::-webkit-scrollbar-track {
            background: #111;
            border-radius: 10px;
        }

        .tab-content::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 10px;
        }

        .tab-content::-webkit-scrollbar-thumb:hover {
            background: #00cc33;
        }

        .deal-selector, .product-card, .conversion-item {
            background: linear-gradient(135deg, #111, #1a1a1a);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.4s ease-out;
        }

        .deal-selector:hover, .product-card:hover {
            border-color: #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            transform: translateY(-2px);
        }

        .deal-selector.selected {
            background: linear-gradient(135deg, #00ff41, #00cc33);
            color: #000;
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
        }

        .deal-selector h3, .product-card h3 {
            margin-bottom: 8px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .deal-selector p, .product-card p {
            font-size: 13px;
            color: #aaa;
            margin: 4px 0;
        }

        .category-badge {
            display: inline-block;
            background: #00ff41;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .recommended-products {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .recommended-products h3 {
            color: #00ff41;
            margin-bottom: 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recommendation-item {
            background: linear-gradient(135deg, #1a1a1a, #222);
            border-left: 3px solid #00ff41;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .recommendation-item h4 {
            color: #00ff41;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .recommendation-item .confidence {
            font-size: 11px;
            color: #888;
        }

        .variant-gen {
            background: linear-gradient(135deg, #1a1a1a, #222);
            border: 1px dashed #00ff41;
            padding: 12px;
            margin-top: 12px;
            border-radius: 4px;
        }

        .variant-gen h4 {
            color: #00ff41;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .variant {
            background: #0a0a0a;
            padding: 8px;
            margin: 4px 0;
            border-radius: 3px;
            font-size: 12px;
            color: #ddd;
            border-left: 2px solid #00ff41;
        }

        .variant .label {
            color: #00ff41;
            font-weight: bold;
            margin-right: 6px;
        }

        .premium-info {
            background: linear-gradient(135deg, #00ff41, #00cc33);
            color: #000;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
            font-weight: bold;
            text-align: center;
        }

        .storefront-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .product-card {
            cursor: pointer;
        }

        .product-card h3 {
            color: #00ff41;
        }

        .product-card .coverage {
            margin: 8px 0;
            color: #00ff41;
            font-weight: bold;
            font-size: 14px;
        }

        .product-card .price-range {
            color: #888;
            font-size: 12px;
            margin: 8px 0;
        }

        .product-card .icon {
            font-size: 28px;
            margin: 8px 0;
        }

        .conversion-item {
            border-left: 4px solid #00ff41;
        }

        .conversion-item.conversion-a {
            border-left-color: #00ff41;
        }

        .conversion-item.conversion-b {
            border-left-color: #00cc33;
        }

        .conversion-item.conversion-c {
            border-left-color: #00ff41;
        }

        .conversion-time {
            color: #00ff41;
            font-weight: bold;
            font-size: 12px;
        }

        .conversion-details {
            font-size: 12px;
            color: #aaa;
            margin-top: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a1a, #222);
            border: 1px solid #333;
            border-left: 3px solid #00ff41;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 24px;
            color: #00ff41;
            font-weight: bold;
            margin: 8px 0;
        }

        .stat-card .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .variant-performance {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 12px 0;
        }

        .variant-stat {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .variant-stat h4 {
            color: #00ff41;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .variant-stat p {
            color: #888;
            font-size: 12px;
        }

        .button {
            background: linear-gradient(135deg, #00ff41, #00cc33);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
        }

        .button:hover {
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .loading {
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes neonGlow {
            0%, 100% { text-shadow: 0 0 5px #00ff41, 0 0 10px #00ff41; }
            50% { text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41; }
        }

        .status-live {
            animation: neonGlow 2s infinite;
            color: #00ff41;
        }

        .error {
            background: #1a0000;
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .storefront-grid {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <header>
            <h1>⚡ GrabInsurance: Embedded Insurance at Deal Redemption</h1>
            <p>Real-time A/B Testing Framework | Intent Classification Engine | Dynamic Pricing</p>
        </header>
        
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('simulator')">Simulator</button>
                <button class="tab-btn" onclick="switchTab('storefront')">Storefront</button>
                <button class="tab-btn" onclick="switchTab('conversions')">Analytics</button>
            </div>

            <div class="tab-content" id="tab-simulator">
                <div id="simulator-content"></div>
            </div>

            <div class="tab-content" id="tab-storefront" style="display:none;">
                <div id="storefront-content"></div>
            </div>

            <div class="tab-content" id="tab-conversions" style="display:none;">
                <div id="conversions-content"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let state = {
            selectedDeal: null,
            sessionId: generateSessionId(),
            deals: [],
            products: [],
            analytics: null,
            tab: 'simulator'
        };

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        const DEALS = [
            { id: 1, merchant: 'Swiggy', category: 'Food', subcategory: 'Food Delivery', dealValue: 499, promo: '30% off' },
            { id: 2, merchant: 'MakeMyTrip', category: 'Travel', subcategory: 'Domestic Flight', dealValue: 12400, promo: '20% off' },
            { id: 3, merchant: 'Amazon', category: 'Electronics', subcategory: 'Smartphones', dealValue: 25000, promo: '25% off' },
            { id: 4, merchant: 'Myntra', category: 'Fashion & Beauty', subcategory: 'Apparel', dealValue: 3000, promo: '40% off' },
            { id: 5, merchant: '1MG', category: 'Health', subcategory: 'Pharmacy', dealValue: 1500, promo: '15% off' }
        ];

        async function initApp() {
            try {
                const productsResp = await fetch(`${API_BASE}/products`);
                state.products = await productsResp.json();
                state.deals = DEALS;
                renderSimulator();
                startLiveUpdates();
            } catch (error) {
                console.error('Init error:', error);
                renderError('Failed to connect to backend. Is MCP server running on port 8000?');
            }
        }

        function renderSimulator() {
            const html = `
                <h2 style="color: #00ff41; margin-bottom: 16px; text-transform: uppercase;">Deal Selection</h2>
                <p style="color: #888; margin-bottom: 16px; font-size: 12px;">Select a deal to see personalized insurance recommendations:</p>
                
                ${state.deals.map((deal, idx) => `
                    <div class="deal-selector ${state.selectedDeal?.id === deal.id ? 'selected' : ''}" 
                         onclick="selectDeal(${idx})">
                        <h3>${deal.merchant}</h3>
                        <p><strong>${deal.category}</strong> • ${deal.subcategory}</p>
                        <p>Deal Value: <span style="color: #00ff41; font-weight: bold;">₹${deal.dealValue}</span></p>
                        <span class="category-badge">${deal.promo}</span>
                    </div>
                `).join('')}

                ${state.selectedDeal ? `
                    <div class="recommended-products">
                        <h3>🎯 Recommended for You</h3>
                        ${getRecommendations().map(rec => `
                            <div class="recommendation-item">
                                <h4>${rec.name}</h4>
                                <p>${rec.coverage}</p>
                                <p class="confidence">Confidence: ${(rec.confidence * 100).toFixed(0)}%</p>
                                <div class="premium-info">₹${rec.premium} / year</div>
                                <div class="variant-gen">
                                    <h4>A/B Copy Variants</h4>
                                    <div class="variant">
                                        <span class="label">Variant A (Direct):</span>
                                        "${rec.variants.variant_A}"
                                    </div>
                                    <div class="variant">
                                        <span class="label">Variant B (Emotional):</span>
                                        "${rec.variants.variant_B}"
                                    </div>
                                    <div class="variant">
                                        <span class="label">Variant C (Social Proof):</span>
                                        "${rec.variants.variant_C}"
                                    </div>
                                </div>
                                <button class="button" onclick="recordConversion('${rec.id}', '${rec.premium}')">
                                    Purchase Insurance
                                </button>
                            </div>
                        `).join('')}
                    </div>
                ` : '<div style="color: #888; text-align: center; padding: 40px; font-style: italic;">Select a deal above to get recommendations</div>'}
            `;
            document.getElementById('simulator-content').innerHTML = html;
        }

        function renderStorefront() {
            const categorized = {};
            state.products.forEach(p => {
                if (!categorized[p.categories[0]]) categorized[p.categories[0]] = [];
                categorized[p.categories[0]].push(p);
            });

            const html = `
                <h2 style="color: #00ff41; margin-bottom: 16px; text-transform: uppercase;">Insurance Catalog</h2>
                <p style="color: #888; margin-bottom: 16px; font-size: 12px;">Browse our complete insurance product portfolio:</p>
                
                ${Object.entries(categorized).map(([cat, products]) => `
                    <div style="margin-bottom: 24px;">
                        <h3 style="color: #00ff41; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 8px;">
                            ${cat}
                        </h3>
                        <div class="storefront-grid">
                            ${products.map(p => `
                                <div class="product-card" onclick="selectProduct('${p.id}')">
                                    <div class="icon">${p.icon}</div>
                                    <h3>${p.name}</h3>
                                    <div class="coverage">${p.coverage}</div>
                                    <p>${p.description}</p>
                                    <div class="price-range">₹${p.minPremium}/year - ₹${Math.round(p.minPremium * 5)}/year</div>
                                    <button class="button" style="width: 100%; margin-top: 12px;">View Details</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
            `;
            document.getElementById('storefront-content').innerHTML = html;
        }

        function renderConversions() {
            if (!state.analytics) {
                document.getElementById('conversions-content').innerHTML = '<p style="color: #888;">Loading analytics...</p>';
                return;
            }

            const analytics = state.analytics;
            const html = `
                <h2 style="color: #00ff41; margin-bottom: 16px; text-transform: uppercase;">A/B Testing Dashboard</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">Total Conversions</div>
                        <div class="value">${analytics.total_conversions || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Revenue Generated</div>
                        <div class="value">₹${(analytics.total_revenue || 0).toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Top Variant</div>
                        <div class="value" style="font-size: 18px; text-transform: uppercase;">
                            ${analytics.variant_C?.conversions > analytics.variant_B?.conversions ? 'C' : analytics.variant_B?.conversions > analytics.variant_A?.conversions ? 'B' : 'A'}
                        </div>
                    </div>
                </div>

                <h3 style="color: #00ff41; margin: 20px 0 12px 0; text-transform: uppercase; font-size: 14px;">Variant Performance</h3>
                <div class="variant-performance">
                    <div class="variant-stat">
                        <h4>Variant A</h4>
                        <p>${analytics.variant_A?.conversions || 0} conversions</p>
                        <p style="color: #00ff41;">₹${(analytics.variant_A?.revenue || 0).toLocaleString()}</p>
                    </div>
                    <div class="variant-stat">
                        <h4>Variant B</h4>
                        <p>${analytics.variant_B?.conversions || 0} conversions</p>
                        <p style="color: #00ff41;">₹${(analytics.variant_B?.revenue || 0).toLocaleString()}</p>
                    </div>
                    <div class="variant-stat">
                        <h4>Variant C</h4>
                        <p>${analytics.variant_C?.conversions || 0} conversions</p>
                        <p style="color: #00ff41;">₹${(analytics.variant_C?.revenue || 0).toLocaleString()}</p>
                    </div>
                </div>

                <h3 style="color: #00ff41; margin: 20px 0 12px 0; text-transform: uppercase; font-size: 14px;">Recent Conversions</h3>
                ${(analytics.recent_conversions || []).slice(0, 10).map((conv, idx) => `
                    <div class="conversion-item conversion-${conv.variant.toLowerCase()}">
                        <div class="conversion-time">🕐 ${new Date(conv.timestamp).toLocaleTimeString()}</div>
                        <div class="conversion-details">
                            <strong>${conv.product_name}</strong> on ${conv.merchant || 'Unknown'} | 
                            Premium: ₹${conv.premium} | 
                            <span style="color: #00ff41; font-weight: bold;">Variant ${conv.variant}</span>
                        </div>
                    </div>
                `).join('')}
            `;
            document.getElementById('conversions-content').innerHTML = html;
        }

        function selectDeal(idx) {
            state.selectedDeal = state.deals[idx];
            renderSimulator();
        }

        function getRecommendations() {
            if (!state.selectedDeal || !state.products) return [];
            
            const deal = state.selectedDeal;
            const relevant = state.products.filter(p => 
                p.categories.includes(deal.category)
            ).slice(0, 2);

            return relevant.map(p => ({
                id: p.id,
                name: p.name,
                coverage: p.coverage,
                premium: Math.round(p.minPremium + (deal.dealValue / 10000) * 10),
                confidence: 0.85 + Math.random() * 0.15,
                variants: generateVariants(p, deal)
            }));
        }

        function generateVariants(product, deal) {
            const variants = {
                variant_A: `Protect your ${deal.promo} ${deal.merchant} purchase. ${product.shortName} for just ₹${Math.round(product.minPremium + (deal.dealValue / 10000) * 10)}.`,
                variant_B: `Don't let anything ruin your plans. ${product.name} keeps your ₹${deal.dealValue} ${deal.category} deal secure.`,
                variant_C: `★ Join 100K+ protected users. ${product.shortName} for ${deal.merchant} purchases - Only ₹${Math.round(product.minPremium + (deal.dealValue / 10000) * 10)}/year`
            };
            return variants;
        }

        async function recordConversion(productId, premium) {
            try {
                const variantChar = String.fromCharCode(65 + Math.floor(Math.random() * 3)); // A, B, or C
                await fetch(`${API_BASE}/conversion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: state.sessionId,
                        productId,
                        premium: parseInt(premium),
                        variant: variantChar,
                        category: state.selectedDeal.category,
                        merchant: state.selectedDeal.merchant
                    })
                });
                alert(`✅ Insurance purchased! Variant ${variantChar} - Premium: ₹${premium}`);
                fetchAnalytics();
            } catch (error) {
                console.error('Conversion error:', error);
            }
        }

        async function fetchAnalytics() {
            try {
                const resp = await fetch(`${API_BASE}/analytics`);
                state.analytics = await resp.json();
                if (state.tab === 'conversions') renderConversions();
            } catch (error) {
                console.error('Analytics error:', error);
            }
        }

        function startLiveUpdates() {
            setInterval(fetchAnalytics, 3000);
        }

        function switchTab(tab) {
            state.tab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tab}`).style.display = 'block';
            event.target.classList.add('active');

            if (tab === 'simulator') renderSimulator();
            else if (tab === 'storefront') renderStorefront();
            else if (tab === 'conversions') renderConversions();
        }

        function renderError(msg) {
            document.getElementById('simulator-content').innerHTML = `<div class="error">${msg}</div>`;
        }

        initApp();
    </script>
</body>
</html>
